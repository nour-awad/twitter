# Production-like local topology:
#   12 containers for the services + Kafka (Redpanda) + Postgres + Jaeger + Prometheus + Grafana.
#
#   docker compose up --build
#   open http://localhost:8000/docs      (API gateway / Swagger)
#        http://localhost:8000/graphql   (GraphQL IDE)
#        http://localhost:8080           (Redpanda console: browse the event topics)
#        http://localhost:16686          (Jaeger: distributed traces)
#        http://localhost:9090           (Prometheus)   http://localhost:3000 (Grafana)

x-build: &build
  context: .
  dockerfile: deploy/docker/Dockerfile

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres: { condition: service_healthy }
    redpanda: { condition: service_healthy }
  environment: &env
    EVENT_BUS: kafka
    KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    LOG_FORMAT: json
    RESILIENCE_MODE: app
    AUTH_SERVICE_URL: http://auth-service:8000
    USER_SERVICE_URL: http://user-service:8000
    TWEET_SERVICE_URL: http://tweet-service:8000
    TIMELINE_SERVICE_URL: http://timeline-service:8000
    ENGAGEMENT_SERVICE_URL: http://engagement-service:8000
    NOTIFICATION_SERVICE_URL: http://notification-service:8000
    SEARCH_SERVICE_URL: http://search-service:8000
    SAGA_SERVICE_URL: http://saga-orchestrator:8000
    AIOPS_SERVICE_URL: http://aiops-service:8000
    AI_AGENT_SERVICE_URL: http://ai-agent-service:8000
    GATEWAY_SERVICE_URL: http://api-gateway:8000
    USER_GRPC_TARGET: user-service:50051
    CONTENT_FILTER_URL: http://content-filter:8000

services:
  # ------------------------------------------------------------- services
  api-gateway:
    <<: *service
    build: { <<: *build, args: { SERVICE_DIR: services/api-gateway, APP_MODULE: "api_gateway.main:app" } }
    ports: ["8000:8000"]

  auth-service:
    <<: *service
    build: { <<: *build, args: { SERVICE_DIR: services/auth-service, APP_MODULE: "auth_service.main:app" } }
    environment: { <<: *env, AUTH_DATABASE_URL: "postgresql+asyncpg://twitter:twitter@postgres:5432/auth" }
    ports: ["8001:8000"]

  user-service:
    <<: *service
    build: { <<: *build, args: { SERVICE_DIR: services/user-service, APP_MODULE: "user_service.main:app" } }
    environment: { <<: *env, USER_DATABASE_URL: "postgresql+asyncpg://twitter:twitter@postgres:5432/users" }
    ports: ["8002:8000", "50051:50051"]

  tweet-service:
    <<: *service
    build: { <<: *build, args: { SERVICE_DIR: services/tweet-service, APP_MODULE: "tweet_service.main:app" } }
    environment: { <<: *env, TWEET_DATABASE_URL: "postgresql+asyncpg://twitter:twitter@postgres:5432/tweets" }
    ports: ["8003:8000"]

  timeline-service:
    <<: *service
    build: { <<: *build, args: { SERVICE_DIR: services/timeline-service, APP_MODULE: "timeline_service.main:app" } }
    environment: { <<: *env, TIMELINE_DATABASE_URL: "postgresql+asyncpg://twitter:twitter@postgres:5432/timeline" }
    ports: ["8004:8000"]

  engagement-service:
    <<: *service
    build: { <<: *build, args: { SERVICE_DIR: services/engagement-service, APP_MODULE: "engagement_service.main:app" } }
    environment: { <<: *env, ENGAGEMENT_DATABASE_URL: "postgresql+asyncpg://twitter:twitter@postgres:5432/engagement" }
    ports: ["8005:8000"]

  notification-service:
    <<: *service
    build: { <<: *build, args: { SERVICE_DIR: services/notification-service, APP_MODULE: "notification_service.main:app" } }
    environment: { <<: *env, NOTIFICATION_DATABASE_URL: "postgresql+asyncpg://twitter:twitter@postgres:5432/notifications" }
    ports: ["8006:8000"]

  search-service:
    <<: *service
    build: { <<: *build, args: { SERVICE_DIR: services/search-service, APP_MODULE: "search_service.main:app" } }
    ports: ["8007:8000"]

  saga-orchestrator:
    <<: *service
    build: { <<: *build, args: { SERVICE_DIR: services/saga-orchestrator, APP_MODULE: "saga_orchestrator.main:app" } }
    environment: { <<: *env, SAGA_DATABASE_URL: "postgresql+asyncpg://twitter:twitter@postgres:5432/sagas" }
    ports: ["8008:8000"]

  aiops-service:
    <<: *service
    build: { <<: *build, args: { SERVICE_DIR: services/aiops-service, APP_MODULE: "aiops_service.main:app" } }
    ports: ["8009:8000"]

  ai-agent-service:
    <<: *service
    build: { <<: *build, args: { SERVICE_DIR: services/ai-agent-service, APP_MODULE: "ai_agent_service.main:app" } }
    environment:
      <<: *env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODERATION_LLM: ${AI_MODERATION_LLM:-false}
    ports: ["8010:8000"]

  # serverless function (Knative in k8s; a plain container here)
  content-filter:
    build: { <<: *build, args: { SERVICE_DIR: functions/content-filter, APP_MODULE: "handler:app" } }
    ports: ["8011:8000"]

  # ------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: twitter, POSTGRES_PASSWORD: twitter, POSTGRES_DB: twitter }
    volumes: ["./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro", "pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U twitter"], interval: 5s, retries: 20 }

  redpanda:  # Kafka-API compatible broker, single binary, no ZooKeeper
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command: [redpanda, start, --smp, "1", --memory, 1G, --mode, dev-container, --default-log-level=warn,
              --kafka-addr, "internal://0.0.0.0:9092,external://0.0.0.0:19092",
              --advertise-kafka-addr, "internal://redpanda:9092,external://localhost:19092"]
    ports: ["19092:19092"]
    healthcheck: { test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"], interval: 5s, retries: 30 }

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment: { KAFKA_BROKERS: redpanda:9092 }
    ports: ["8080:8080"]
    depends_on: { redpanda: { condition: service_healthy } }

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686", "4318:4318"]

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes: ["./deploy/prometheus:/etc/prometheus:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

volumes:
  pgdata:
