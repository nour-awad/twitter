# Serverless function (Week 9): scale-to-zero when idle, autoscale on concurrency.
#   kubectl apply -f deploy/knative/content-filter.yaml
# then set CONTENT_FILTER_URL=http://content-filter.<ns>.svc.cluster.local on tweet-service.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: content-filter
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"      # scale to zero
        autoscaling.knative.dev/max-scale: "20"
        autoscaling.knative.dev/target: "50"         # concurrent requests per pod
    spec:
      containers:
        - image: ghcr.io/nour-awad/twitter/content-filter:latest
          env:
            - { name: APP_MODULE, value: "handler:app" }
            - { name: FILTER_WORDS, value: "darn,heck,spamlink" }
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /healthz } }
---
# Optional: trigger the same function asynchronously from tweet events (Knative Eventing).
apiVersion: eventing.knative.dev/v1
kind: Trigger
metadata:
  name: content-filter-on-tweet-created
spec:
  broker: default
  filter:
    attributes: { type: tweet.created.v1 }
  subscriber:
    ref: { apiVersion: serving.knative.dev/v1, kind: Service, name: content-filter }
