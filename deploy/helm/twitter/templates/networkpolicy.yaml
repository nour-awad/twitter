{{- /* Zero trust at L3/L4: default-deny ingress; only pods of this app (and the mesh/ingress
     and monitoring namespaces) may connect. L7 identity rules live in istio.yaml. */ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-twitter-internal
spec:
  podSelector: { matchLabels: { app.kubernetes.io/part-of: twitter } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/part-of: twitter } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: istio-system } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
{{- end }}
