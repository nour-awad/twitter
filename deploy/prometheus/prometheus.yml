global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: twitter-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-gateway:8000
          - auth-service:8000
          - user-service:8000
          - tweet-service:8000
          - timeline-service:8000
          - engagement-service:8000
          - notification-service:8000
          - search-service:8000
          - saga-orchestrator:8000
          - aiops-service:8000
          - ai-agent-service:8000
